<svg xmlns="http://www.w3.org/2000/svg" width="800" height="346" viewBox="0 0 800 346">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#08120c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; dominant-baseline: middle; }
    @keyframes ln0 { 0%,0% { opacity: 0 } 2%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln2 { 0%,6% { opacity: 0 } 8%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln3 { 0%,9% { opacity: 0 } 11%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln4 { 0%,12% { opacity: 0 } 14%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln5 { 0%,15% { opacity: 0 } 17%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln6 { 0%,18% { opacity: 0 } 20%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln8 { 0%,24% { opacity: 0 } 26%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln9 { 0%,27% { opacity: 0 } 29%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln11 { 0%,33% { opacity: 0 } 35%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .ln0 { animation: ln0 12s ease-in-out infinite }
    .ln2 { animation: ln2 12s ease-in-out infinite }
    .ln3 { animation: ln3 12s ease-in-out infinite }
    .ln4 { animation: ln4 12s ease-in-out infinite }
    .ln5 { animation: ln5 12s ease-in-out infinite }
    .ln6 { animation: ln6 12s ease-in-out infinite }
    .ln8 { animation: ln8 12s ease-in-out infinite }
    .ln9 { animation: ln9 12s ease-in-out infinite }
    .ln11 { animation: ln11 12s ease-in-out infinite }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>

  <g font-size="11" font-family="monospace" fill="#22c55e" opacity="0.28">
    <text x="25"  y="100" style="animation: ln0 9s linear infinite">0 A C</text>
    <text x="100" y="70"  style="animation: ln2 8s linear infinite">9 2 7</text>
    <text x="220" y="180" style="animation: ln3 7s linear infinite">E 4 1</text>
    <text x="400" y="60"  style="animation: ln4 9.5s linear infinite">F 5 B</text>
    <text x="580" y="200" style="animation: ln5 6.5s linear infinite">3 8 ア</text>
    <text x="720" y="120" style="animation: ln6 8.5s linear infinite">D 6 2</text>
  </g>

  <line x1="0" y1="40" x2="800" y2="40" stroke="#22c55e" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57" opacity="0.8"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e" opacity="0.8"/>
  <circle cx="64" cy="24" r="6" fill="#28c840" opacity="0.8"/>
  <text x="400" y="28" fill="#22c55e" fill-opacity="0.7" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">root@mounik:~$ /proc/github/stats</text>

  <g class="ln0" transform="translate(40 64)"><text fill="#FACC15" filter="url(#glow)">root@mounik:~$</text><text x="140" fill="#86efac">kali --scan rmounikkumar</text></g>
  <g class="ln2" transform="translate(60 108)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">repos</text><text x="120" fill="#e7e7ea">5</text><text x="172" fill="#3f6212">public</text></g>
  <g class="ln3" transform="translate(60 130)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">followers</text><text x="120" fill="#e7e7ea">1</text><text x="172" fill="#3f6212">node</text></g>
  <g class="ln4" transform="translate(60 152)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">following</text><text x="120" fill="#e7e7ea">4</text><text x="172" fill="#3f6212">targets</text></g>
  <g class="ln5" transform="translate(60 174)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">activity</text><text x="120" fill="#4ade80">●</text><text x="140" fill="#e7e7ea">20+ commits</text><text x="300" fill="#3f6212">this yr</text></g>
  <g class="ln6" transform="translate(60 196)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">firewall</text><text x="120" fill="#4ade80">●</text><text x="140" fill="#e7e7ea">bypass — building anyway</text></g>
  <g class="ln8" transform="translate(40 240)"><text fill="#FACC15" filter="url(#glow)"># </text><text x="22" fill="#86efac">decrypt → top languages</text></g>
  <g class="ln9" transform="translate(60 262)"><text fill="#FACC15">██=</text><text x="56" fill="#86efac">JavaScript 80%</text><text x="200" fill="#3f6212">████████████</text></g>
  <g class="ln9" transform="translate(60 282)"><text fill="#FACC15">██</text><text x="32" fill="#86efac">TypeScript 40%</text><text x="200" fill="#3f6212">██████</text></g>
  <g class="ln9" transform="translate(60 302)"><text fill="#86efac">█</text><text x="24" fill="#86efac">Python 30%</text><text x="200" fill="#3f6212">████</text></g>
  <g class="ln11" transform="translate(40 328)"><text fill="#FACC15" filter="url(#glow)">root@mounik:~$</text><rect x="140" y="-7" width="10" height="15" fill="#4ade80" style="animation: blink 1s steps(1) infinite"/></g>
</svg>
