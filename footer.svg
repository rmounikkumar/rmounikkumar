<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#08120c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; dominant-baseline: middle; }
    @keyframes ln0 { 0%,0% { opacity: 0 } 4%,86% { opacity: 1 } 94%,100% { opacity: 0 } }
    @keyframes ln1 { 0%,7% { opacity: 0 } 11%,86% { opacity: 1 } 94%,100% { opacity: 0 } }
    @keyframes ln2 { 0%,14% { opacity: 0 } 18%,86% { opacity: 1 } 94%,100% { opacity: 0 } }
    @keyframes ln3 { 0%,21% { opacity: 0 } 25%,86% { opacity: 1 } 94%,100% { opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .ln0 { animation: ln0 12s ease-in-out infinite }
    .ln1 { animation: ln1 12s ease-in-out infinite }
    .ln2 { animation: ln2 12s ease-in-out infinite }
    .ln3 { animation: ln3 12s ease-in-out infinite }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>

  <g font-size="11" font-family="monospace" fill="#22c55e" opacity="0.3">
    <text x="60"  y="60"  style="animation: ln0 9s linear infinite">C 4 9</text>
    <text x="200" y="130" style="animation: ln1 8s linear infinite">A 2 5</text>
    <text x="450" y="70"  style="animation: ln2 7s linear infinite">F 8 B</text>
    <text x="670" y="120" style="animation: ln3 9.5s linear infinite">3 0 6</text>
  </g>

  <line x1="0" y1="40" x2="800" y2="40" stroke="#22c55e" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57" opacity="0.8"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e" opacity="0.8"/>
  <circle cx="64" cy="24" r="6" fill="#28c840" opacity="0.8"/>
  <text x="400" y="28" fill="#22c55e" fill-opacity="0.7" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">root@mounik:~$ ./signoff.sh</text>

  <g class="ln0" transform="translate(40 62)"><text fill="#FACC15" filter="url(#glow)">root@mounik:~$</text><text x="140" fill="#86efac">exit --translate</text></g>
  <g class="ln1" transform="translate(40 84)"><text fill="#22c55e">&gt;&gt;</text><text x="40" fill="#e7e7ea">"Thanks for visiting the node. Stay curious."</text><text x="420" fill="#FACC15">- R. Mounik Kumar</text></g>
  <g class="ln2" transform="translate(40 118)"><text fill="#3f6212"># </text><text x="22" fill="#4ade80">channels</text>
    <text x="110" fill="#86efac">github</text><text x="200" fill="#3f6212">/rmounikkumar</text>
    <text x="290" fill="#3f6212">·</text>
    <text x="306" fill="#86efac">linkedin</text><text x="408" fill="#3f6212">/in/rmounikkumar</text>
    <text x="498" fill="#3f6212">·</text>
    <text x="514" fill="#86efac">site</text><text x="584" fill="#3f6212">r-mounik-kumar.vercel.app</text>
  </g>
  <g class="ln3" transform="translate(40 150)"><text fill="#FACC15" filter="url(#glow)">root@mounik:~$</text><rect x="140" y="-7" width="10" height="15" fill="#4ade80" style="animation: blink 1s steps(1) infinite" /></g>
</svg>
