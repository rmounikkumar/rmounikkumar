<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#08120c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; dominant-baseline: middle; }
    @keyframes ln0 { 0%,0% { opacity: 0 } 2%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln2 { 0%,6% { opacity: 0 } 8%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln3 { 0%,9% { opacity: 0 } 11%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln4 { 0%,12% { opacity: 0 } 14%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln5 { 0%,15% { opacity: 0 } 17%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln6 { 0%,18% { opacity: 0 } 20%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln7 { 0%,21% { opacity: 0 } 23%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes ln8 { 0%,24% { opacity: 0 } 26%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes rain { 0% { transform: translateY(-30px); opacity: 0 } 12% { opacity: 0.5 } 85% { opacity: 0.5 } 100% { transform: translateY(420px); opacity: 0 } }
    .ln0 { animation: ln0 12s ease-in-out infinite }
    .ln2 { animation: ln2 12s ease-in-out infinite }
    .ln3 { animation: ln3 12s ease-in-out infinite }
    .ln4 { animation: ln4 12s ease-in-out infinite }
    .ln5 { animation: ln5 12s ease-in-out infinite }
    .ln6 { animation: ln6 12s ease-in-out infinite }
    .ln7 { animation: ln7 12s ease-in-out infinite }
    .ln8 { animation: ln8 12s ease-in-out infinite }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>
  <rect width="100%" height="100%" rx="14" ry="14" fill="url(#bg)" opacity="0"/>

  <!-- Matrix rain -->
  <g font-size="12" font-family="monospace" fill="#22c55e" opacity="0.35">
    <text x="20"  y="80"  style="animation: rain 7s linear infinite">ア 0 1</text>
    <text x="60"  y="40"  style="animation: rain 9s linear infinite 0.5s">7 カ 3</text>
    <text x="110" y="120" style="animation: rain 6s linear infinite 1.2s">5 セ 8</text>
    <text x="160" y="60"  style="animation: rain 8s linear infinite 2s">9 メ F</text>
    <text x="210" y="110" style="animation: rain 7s linear infinite 0.8s">C 4 り</text>
    <text x="265" y="50"  style="animation: rain 9.5s linear infinite 1.8s">2 ワ 0</text>
    <text x="320" y="95"  style="animation: rain 6.5s linear infinite 0.3s">A 7 ヲ</text>
    <text x="375" y="45"  style="animation: rain 8.5s linear infinite 2.4s">6 ろ 1</text>
    <text x="430" y="130" style="animation: rain 7.5s linear infinite 1s">D 3 ソ</text>
    <text x="485" y="70"  style="animation: rain 6s linear infinite 2.8s">B 5 カ</text>
    <text x="540" y="105" style="animation: rain 9s linear infinite 0.6s">0 8 へ</text>
    <text x="595" y="55"  style="animation: rain 7s linear infinite 1.6s">E 2 ミ</text>
    <text x="650" y="120" style="animation: rain 8s linear infinite 2.2s">4 A ユ</text>
    <text x="705" y="40"  style="animation: rain 6.5s linear infinite 0.9s">F 9 ヲ</text>
    <text x="760" y="90"  style="animation: rain 7.5s linear infinite 1.4s">1 6 サ</text>
  </g>

  <!-- Scanlines -->
  <g opacity="0.05" stroke="#22c55e" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="190" x2="800" y2="190"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
  </g>

  <!-- Title bar -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#22c55e" stroke-opacity="0.15" stroke-width="1"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57" opacity="0.8"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e" opacity="0.8"/>
  <circle cx="64" cy="24" r="6" fill="#28c840" opacity="0.8"/>
  <text x="400" y="28" fill="#22c55e" fill-opacity="0.7" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">root@mounik:~$ whoami --reveal</text>

  <g class="ln0" transform="translate(40 74)"><text fill="#FACC15" filter="url(#glow)">#</text><text x="22" fill="#86efac">ACCESS GRANTED</text><text x="160" fill="#3f6212">// decrypting identity…</text></g>
  <g class="ln2" transform="translate(60 118)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">name</text><text x="160" fill="#e7e7ea">R. Mounik Kumar</text></g>
  <g class="ln3" transform="translate(60 140)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">role</text><text x="160" fill="#e7e7ea">Full-Stack Developer</text></g>
  <g class="ln4" transform="translate(60 162)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">clearance</text><text x="160" fill="#e7e7ea">3rd-Year B.Tech CSE</text></g>
  <g class="ln5" transform="translate(60 184)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">location</text><text x="160" fill="#e7e7ea">[REDACTED] · India</text></g>
  <g class="ln6" transform="translate(60 206)"><text fill="#3f6212">[</text><text x="6" fill="#FACC15">›</text><text x="20" fill="#3f6212">]</text><text x="42" fill="#4ade80">mission</text><text x="160" fill="#e7e7ea">Ship code. Break things. Learn.</text></g>
  <g class="ln7" transform="translate(40 240)"><text fill="#3f6212"># </text><text x="22" fill="#86efac">fingerprint: 0xA1F·9CE·R.4</text><text x="420" fill="#FACC15">▮▮▮▮▮▮▮▮▮▮</text></g>
  <g class="ln8" transform="translate(40 268)"><text fill="#FACC15" filter="url(#glow)">root@mounik:~$</text><rect x="130" y="-7" width="10" height="15" fill="#4ade80" style="animation: blink 1s steps(1) infinite" /></g>
</svg>
